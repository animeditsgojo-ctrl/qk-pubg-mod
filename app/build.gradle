apply plugin: 'com.android.application'

android {
    namespace 'com.qk.pubgmod'
    compileSdk 33
    defaultConfig {
        applicationId "com.qk.pubgmod"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
}

dependencies {
    compileOnly files('libs/XposedBridgeApi-89.jar')
}
