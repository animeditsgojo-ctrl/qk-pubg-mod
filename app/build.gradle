apply plugin: 'com.android.application'

android {
    namespace 'com.qk.pubgmod'
    compileSdk 33
    defaultConfig {
        applicationId "com.qk.pubgmod"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
