name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download XposedBridgeApi
        run: |
          mkdir -p app/libs
          wget -O app/libs/XposedBridgeApi-89.jar \
            https://github.com/rovo89/XposedBridge/releases/download/art-b89/XposedBridgeApi-89.jar

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: qk-pubg-mod
          path: app/build/outputs/apk/debug/app-debug.apk
