name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download XposedBridgeApi
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/XposedBridgeApi-89.jar \
            https://github.com/rovo89/XposedBridge/releases/download/art-b89/XposedBridgeApi-89.jar

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "qk-pubg-mod"
          include ':app'
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qk-pubg-mod
          path: app/build/outputs/apk/debug/app-debug.apk
