name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

            - name: Create XposedBridgeApi stub
        run: |
          mkdir -p app/libs
          cat > /tmp/XposedBridge.java << 'EOF'
          package de.robv.android.xposed;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(callbacks.XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF
          
          mkdir -p /tmp/xposed-src/de/robv/android/xposed/callbacks
          
          cat > /tmp/xposed-src/de/robv/android/xposed/IXposedHookLoadPackage.java << 'EOF'
          package de.robv.android.xposed;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF
          
          cat > /tmp/xposed-src/de/robv/android/xposed/XposedBridge.java << 'EOF'
          package de.robv.android.xposed;
          public class XposedBridge {
              public static void log(String text) {}
              public static void log(Throwable t) {}
          }
          EOF
          
          cat > /tmp/xposed-src/de/robv/android/xposed/XposedHelpers.java << 'EOF'
          package de.robv.android.xposed;
          public class XposedHelpers {
              public static Class<?> findClass(String className, ClassLoader classLoader) { return null; }
              public static void findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) {}
              public static void findAndHookMethod(String className, ClassLoader classLoader, String methodName, Object... parameterTypesAndCallback) {}
              public static Object getObjectField(Object obj, String fieldName) { return null; }
              public static Object callMethod(Object obj, String methodName, Object... args) { return null; }
          }
          EOF
          
          cat > /tmp/xposed-src/de/robv/android/xposed/XC_MethodHook.java << 'EOF'
          package de.robv.android.xposed;
          public abstract class XC_MethodHook {
              public class MethodHookParam {
                  public Object thisObject;
                  public Object[] args;
                  public Object getResult() { return null; }
                  public void setResult(Object result) {}
              }
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
          }
          EOF
          
          cat > /tmp/xposed-src/de/robv/android/xposed/callbacks/XC_LoadPackage.java << 'EOF'
          package de.robv.android.xposed.callbacks;
          public class XC_LoadPackage {
              public static class LoadPackageParam {
                  public String packageName;
                  public ClassLoader classLoader;
              }
          }
          EOF
          
          cd /tmp/xposed-src
          find . -name "*.java" | xargs javac -source 8 -target 8
          jar cf app/libs/XposedBridgeApi-89.jar $(find . -name "*.class")
          cp app/libs/XposedBridgeApi-89.jar $GITHUB_WORKSPACE/app/libs/
          echo "Stub jar created: $(du -h $GITHUB_WORKSPACE/app/libs/XposedBridgeApi-89.jar)"

      - name: Verify jar exists
        run: |
          if [ ! -f app/libs/XposedBridgeApi-89.jar ]; then
            echo "JAR MISSING"
            exit 1
          fi
          echo "JAR OK: $(du -h app/libs/XposedBridgeApi-89.jar)"

      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          rootProject.name = "qk-pubg-mod"
          include ':app'
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qk-pubg-mod
          path: app/build/outputs/apk/debug/app-debug.apk
