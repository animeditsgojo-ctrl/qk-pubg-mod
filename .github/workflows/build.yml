name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download XposedBridgeApi
        run: |
          mkdir -p app/libs
          wget -O app/libs/XposedBridgeApi-89.jar \
            https://github.com/rovo89/XposedBridge/releases/download/art-b89/XposedBridgeApi-89.jar

      - name: Create gradlew
        run: |
          wget -O gradle-8.0-bin.zip https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip gradle-8.0-bin.zip
          export PATH=$PATH:$(pwd)/gradle-8.0/bin
          gradle wrapper
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qk-pubg-mod
          path: app/build/outputs/apk/debug/app-debug.apk
